<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iMovies — Movie Ticket Booking Made Simple</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: #0c1017; color: #fff; min-height: 100vh; overflow-x: hidden; }
    a { color: inherit; text-decoration: none; }
    button { cursor: pointer; border: none; outline: none; font-family: inherit; }
    input, select { font-family: inherit; outline: none; }
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #0c1017; }
    ::-webkit-scrollbar-thumb { background: #212836; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #30363d; }

    /* Top Nav */
    .navbar {
      display: flex;
      justifyContent: space-between;
      align-items: center;
      padding: 0.8rem 2.5rem;
      background: #131926;
      border-bottom: 1px solid #1f2738;
      position: sticky;
      top: 0;
      z-index: 1000;
    }
    .logo {
      font-size: 1.6rem;
      font-weight: 800;
      cursor: pointer;
      letter-spacing: -0.5px;
    }
    .logo span { color: #e50914; }
    .search-bar {
      width: 35%;
      max-width: 420px;
    }
    .search-bar input {
      width: 100%;
      padding: 0.55rem 1rem;
      background: #1f2738;
      border: 1px solid #303a4e;
      border-radius: 4px;
      color: #fff;
      font-size: 0.9rem;
    }
    .nav-icons {
      display: flex;
      gap: 1.2rem;
      align-items: center;
      font-size: 1.1rem;
      color: #8b949e;
    }
    .nav-icons span {
      cursor: pointer;
      transition: color 0.2s;
    }
    .nav-icons span:hover {
      color: #fff;
    }
    .user-pill {
      font-size: 0.85rem;
      color: #fff;
      background: #1f2738;
      border: 1px solid #303a4e;
      padding: 0.3rem 0.8rem;
      border-radius: 20px;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .btn-admin-pill {
      font-size: 0.8rem;
      font-weight: 700;
      color: #e50914;
      background: transparent;
      border: 1px solid #e50914;
      padding: 0.25rem 0.75rem;
      border-radius: 4px;
      transition: all 0.2s;
    }
    .btn-admin-pill:hover {
      background: #e50914;
      color: #fff;
    }
    .btn-logout {
      font-size: 0.8rem;
      font-weight: 600;
      color: #fca5a5;
      background: #450a0a;
      border: 1px solid #7f1d1d;
      padding: 0.25rem 0.65rem;
      border-radius: 4px;
      transition: all 0.2s;
    }
    .btn-logout:hover {
      background: #7f1d1d;
      color: #fff;
    }

    /* Red Header Banner */
    .red-banner {
      background: #e50914;
      color: #fff;
      padding: 0.8rem 1rem;
      text-align: center;
      font-weight: 700;
      font-size: 1.25rem;
      letter-spacing: 0.5px;
    }

    /* Views Container */
    .view-content {
      animation: fadeIn 0.25s ease-in-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Landing View */
    .landing-hero {
      min-height: calc(100vh - 65px);
      background: radial-gradient(circle at 60% 40%, #151c2c 0%, #080b11 100%);
      display: flex;
      flex-direction: column;
      justifyContent: center;
      padding: 0 10vw;
    }
    .landing-title {
      font-size: 3.8rem;
      font-weight: 800;
      margin-bottom: 1rem;
      line-height: 1.1;
    }
    .landing-title span { color: #e50914; }
    .landing-subtitle {
      font-size: 1.25rem;
      color: #9ca3af;
      max-width: 620px;
      margin-bottom: 2.5rem;
      line-height: 1.6;
    }
    .landing-actions {
      display: flex;
      gap: 1.2rem;
      align-items: center;
      flex-wrap: wrap;
    }
    .btn-primary {
      background-color: #e50914;
      color: #fff;
      padding: 0.75rem 2.2rem;
      border-radius: 50px;
      font-weight: 700;
      font-size: 1rem;
      transition: background 0.2s, transform 0.1s;
    }
    .btn-primary:hover {
      background-color: #b20710;
      transform: translateY(-1px);
    }
    .btn-secondary {
      background-color: transparent;
      color: #fff;
      padding: 0.75rem 2.2rem;
      border-radius: 50px;
      border: 1px solid #4b5563;
      font-weight: 700;
      font-size: 1rem;
      transition: all 0.2s;
    }
    .btn-secondary:hover {
      border-color: #fff;
      background: rgba(255,255,255,0.05);
    }
    .btn-browse {
      background-color: #1f2738;
      color: #cbd5e1;
      padding: 0.75rem 1.8rem;
      border-radius: 50px;
      font-weight: 600;
      font-size: 0.95rem;
      transition: all 0.2s;
    }
    .btn-browse:hover {
      background-color: #2b364c;
      color: #fff;
    }

    /* Auth Cards */
    .auth-wrapper {
      min-height: calc(100vh - 65px);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 2rem;
    }
    .auth-card {
      background: #131926;
      border: 1px solid #7f1d1d;
      border-radius: 10px;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .auth-header {
      text-align: center;
      margin-bottom: 1.5rem;
    }
    .auth-header h1 {
      font-size: 2rem;
      font-weight: 800;
    }
    .auth-header h1 span { color: #e50914; }
    .auth-header h2 {
      font-size: 1.1rem;
      font-weight: 400;
      color: #cbd5e1;
      margin-top: 0.4rem;
    }
    .form-group {
      margin-bottom: 1rem;
    }
    .form-group label {
      display: block;
      font-size: 0.85rem;
      color: #94a3b8;
      margin-bottom: 0.3rem;
    }
    .form-group input, .form-group select {
      width: 100%;
      padding: 0.65rem;
      background: #1f2738;
      border: 1px solid #334155;
      color: #fff;
      border-radius: 5px;
      font-size: 0.9rem;
    }
    .form-checkbox {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.85rem;
      color: #94a3b8;
      margin-bottom: 1.2rem;
      cursor: pointer;
    }
    .btn-submit {
      width: 100%;
      padding: 0.75rem;
      background: #e50914;
      color: #fff;
      border-radius: 5px;
      font-weight: 700;
      font-size: 1rem;
      transition: background 0.2s;
    }
    .btn-submit:hover {
      background: #b20710;
    }
    .auth-footer {
      margin-top: 1.2rem;
      font-size: 0.85rem;
      text-align: center;
      color: #94a3b8;
    }
    .auth-footer span {
      color: #e50914;
      cursor: pointer;
      font-weight: 600;
    }

    /* Movies Grid */
    .movies-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 1.8rem;
      padding: 2.5rem 3rem;
    }
    .movie-card {
      background: #131926;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #1f2738;
      position: relative;
      transition: transform 0.2s, box-shadow 0.2s;
      cursor: pointer;
    }
    .movie-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
      border-color: #334155;
    }
    .movie-poster-box {
      height: 280px;
      background: #0a0d14;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .movie-poster-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s;
    }
    .movie-card:hover .movie-poster-box img {
      transform: scale(1.04);
    }
    .movie-info {
      padding: 0.8rem;
    }
    .movie-title {
      font-size: 0.95rem;
      font-weight: 700;
      margin-bottom: 0.3rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .movie-date {
      font-size: 0.75rem;
      color: #8b949e;
      margin-bottom: 0.5rem;
    }
    .movie-genres {
      display: flex;
      flex-wrap: wrap;
      gap: 0.3rem;
    }
    .badge-genre {
      background: #7f1d1d;
      color: #fca5a5;
      font-size: 0.65rem;
      padding: 0.15rem 0.45rem;
      border-radius: 3px;
      font-weight: 600;
    }
    .btn-delete-circle {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #fff;
      color: #e50914;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      box-shadow: 0 2px 6px rgba(0,0,0,0.5);
      z-index: 10;
    }

    /* Shows View */
    .section-container {
      padding: 2.5rem 3rem;
      max-width: 960px;
      margin: 0 auto;
    }
    .back-btn {
      background: none;
      color: #e50914;
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 1.5rem;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }
    .shows-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1.5rem;
      margin-top: 1.5rem;
    }
    .show-card {
      background: #131926;
      border: 1px solid #1f2738;
      border-radius: 8px;
      padding: 1.5rem;
    }
    .show-card h3 {
      font-size: 1.15rem;
      margin-bottom: 0.6rem;
    }
    .show-card p {
      font-size: 0.85rem;
      color: #8b949e;
      margin: 0.25rem 0;
    }

    /* 3-Tier Seating */
    .screen-indicator {
      height: 5px;
      background: #e50914;
      width: 65%;
      margin: 0 auto 1.2rem auto;
      border-radius: 3px;
      box-shadow: 0 0 15px rgba(229, 9, 20, 0.6);
    }
    .tier-label {
      font-size: 0.85rem;
      font-weight: 700;
      margin-bottom: 0.6rem;
      letter-spacing: 0.5px;
    }
    .seat-grid-8 {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 0.5rem;
      max-width: 440px;
      margin: 0 auto 1.5rem auto;
    }
    .seat-btn {
      padding: 0.5rem 0;
      background: #1f2738;
      color: #fff;
      border: 1px solid #334155;
      border-radius: 4px;
      font-weight: 700;
      font-size: 0.8rem;
      transition: all 0.15s;
    }
    .seat-btn:hover {
      border-color: #e50914;
    }
    .seat-btn.selected {
      background: #e50914;
      border-color: #e50914;
      box-shadow: 0 0 8px rgba(229, 9, 20, 0.8);
    }

    /* Bookings & Admin */
    .bookings-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1.5rem;
      padding: 2rem 3rem;
    }
    .booking-ticket {
      display: flex;
      background: #131926;
      border: 1px solid #1f2738;
      border-radius: 8px;
      overflow: hidden;
    }
    .booking-ticket img {
      width: 120px;
      height: 160px;
      object-fit: cover;
    }
    .booking-ticket-info {
      padding: 0.8rem 1rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      flex: 1;
      font-size: 0.85rem;
    }

    /* Admin Dropzone */
    .dropzone-poster {
      height: 160px;
      border: 2px dashed #e50914;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: #131926;
      margin-bottom: 1.5rem;
      color: #e50914;
      font-weight: 600;
      gap: 0.5rem;
      cursor: pointer;
    }

    /* Notification Toast */
    #toast {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      background: #e50914;
      color: #fff;
      padding: 0.8rem 1.5rem;
      border-radius: 6px;
      font-weight: 600;
      box-shadow: 0 5px 20px rgba(0,0,0,0.6);
      z-index: 9999;
      display: none;
      animation: toastIn 0.3s ease-out;
    }
    @keyframes toastIn {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
  </style>
</head>
<body>

  <!-- Top Navigation -->
  <header class="navbar">
    <div class="logo" onclick="switchView('home')">i<span>Movies</span></div>
    
    <div class="search-bar" id="searchBarContainer">
      <input type="text" id="movieSearchInput" placeholder="Search movies..." oninput="handleSearch(this.value)">
    </div>

    <div class="nav-icons" id="navIcons">
      <!-- Injected via JavaScript -->
    </div>
  </header>

  <!-- Red Header Banner -->
  <div class="red-banner" id="globalBanner" style="display: none;">
    Available Movies
  </div>

  <!-- Dynamic Views Container -->
  <main id="appContainer" class="view-content"></main>

  <!-- Notification Toast -->

  <script>
    // Pure Vanilla JS Single Page App State — Zero Runtime External CDNs
    const DEFAULT_USERS = [

    ];

    // Load registered users and session from localStorage
    function getStoredUsers() {
      try {
        const stored = localStorage.getItem('imovies_registered_users');

      } catch (e) {
        return DEFAULT_USERS;
      }
    }

    function getStoredSession() {
      try {
        const session = localStorage.getItem('imovies_active_session');
        return session ? JSON.parse(session) : null;
      } catch (e) {
        return null;
      }
    }

    const STATE = {

      isAdmin: false,
      user: getStoredSession(),
      searchQuery: '',

      selectedShow: null,
      selectedSeats: [],
      registeredUsers: getStoredUsers(),
      
      // Real High-Quality Movie Posters Searched from TMDB & Wikimedia

        },
        {

        },
        {

        }
      ],

      shows: [
        { id: "s1", movie: "Og", theatre: "Srinivasa", date: "Sep 25, 2025", time: "2:00 PM" },
        { id: "s2", movie: "Og", theatre: "Srinivasa", date: "Sep 25, 2025", time: "4:00 PM" },
        { id: "s3", movie: "Og", theatre: "Srinivasa", date: "Sep 26, 2025", time: "9:00 PM" },
        { id: "s4", movie: "Rrr", theatre: "Gokul", date: "Nov 14, 2025", time: "2:00 PM" },
        { id: "s5", movie: "Pushpa 2: The Rule", theatre: "Gokul", date: "Nov 14, 2025", time: "6:00 PM" },
        { id: "s6", movie: "Rajasaab", theatre: "Gokul", date: "Jan 2, 2026", time: "9:30 PM" }

      bookings: [
        {
          id: "BK-101",

        },
        {

        {

          seats: "Balcony Seats: 198",
          price: "200₹",
          poster: "https://image.tmdb.org/t/p/w500/1T21FblunT0y8fz7YaW8JMYgUKm.jpg"
        }
      ]
    };

    function showToast(msg, isError = false) {
      const t = document.getElementById('toast');
      t.innerText = msg;
      t.style.background = isError ? '#991b1b' : '#e50914';
      t.style.display = 'block';
      setTimeout(() => { t.style.display = 'none'; }, 3500);
    }

    function switchView(viewName, payload = null) {
      STATE.view = viewName;
      if (payload?.movie) STATE.selectedMovie = payload.movie;
      if (payload?.show) STATE.selectedShow = payload.show;
      renderApp();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function handleSearch(val) {
      STATE.searchQuery = val.toLowerCase();
      if (STATE.view !== 'home') {
        STATE.view = 'home';
      }
      renderApp();
    }

    function toggleAdminMode(enable) {
      STATE.isAdmin = enable;
      switchView(enable ? 'admin' : 'home');
      showToast(enable ? 'Switched to Admin Portal' : 'Returned to User View');
    }

    function handleLogout() {
      STATE.user = null;
      STATE.isAdmin = false;
      try { localStorage.removeItem('imovies_active_session'); } catch (e) {}
      showToast('Logged out successfully');
      switchView('landing');
    }

    // Top Navbar Update
    function updateNavbar() {
      const nav = document.getElementById('navIcons');
      const searchBox = document.getElementById('searchBarContainer');
      const banner = document.getElementById('globalBanner');

      if (STATE.view === 'landing') {
        searchBox.style.display = 'none';
        banner.style.display = 'none';
        nav.innerHTML = `
          <button class="btn-primary" onclick="switchView('login')" style="padding: 0.45rem 1.2rem; font-size: 0.85rem;">Sign In</button>
          <button class="btn-secondary" onclick="switchView('register')" style="padding: 0.45rem 1.2rem; font-size: 0.85rem;">Sign Up</button>
        `;
        return;
      }

      if (STATE.view === 'home') {
        banner.style.display = 'block';
        searchBox.style.display = 'block';
      } else {
        banner.style.display = 'none';
        searchBox.style.display = STATE.isAdmin ? 'none' : 'block';
      }

      if (!STATE.isAdmin) {
        let userBadge = '';
        if (STATE.user) {
          userBadge = `
            <div class="user-pill" title="Logged in as ${STATE.user.username}">
              👤 <strong>${STATE.user.username}</strong>
            </div>
            <button class="btn-logout" onclick="handleLogout()" title="Sign out">Logout</button>
          `;
        } else {
          userBadge = `
            <button class="btn-primary" onclick="switchView('login')" style="padding: 0.35rem 0.9rem; font-size: 0.8rem;">Login</button>
            <button class="btn-secondary" onclick="switchView('register')" style="padding: 0.35rem 0.9rem; font-size: 0.8rem;">Register</button>
          `;
        }

    // Authentication Handlers
    function togglePasswordVisibility(ids) {
      ids.forEach(id => {
        const el = document.getElementById(id);
        if (el) el.type = el.type === 'password' ? 'text' : 'password';
      });
    }

    // 100% Working Sign Up Handler
    function handleSignupSubmit(e) {
      e.preventDefault();
      const username = document.getElementById('regUsername').value.trim();
      const email = document.getElementById('regEmail').value.trim().toLowerCase();
      const password = document.getElementById('regPassword').value;
      const confirmPassword = document.getElementById('regConfirmPassword').value;

      // 1. Username length check (min 3 chars per schema)
      if (username.length < 3) {
        showToast('Username must be at least 3 characters long!', true);
        return;
      }

      // 2. Email format check
      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!emailRegex.test(email)) {
        showToast('Please enter a valid email address!', true);
        return;
      }

      // 3. Password length check (min 8 chars per schema)
      if (password.length < 8) {
        showToast('Password must be at least 8 characters long!', true);
        return;
      }

      // 4. Password match check
      if (password !== confirmPassword) {
        showToast('Passwords do not match! Please check again.', true);
        return;
      }

      // 5. Existing user check
      const userExists = STATE.registeredUsers.some(u => u.email === email);
      if (userExists) {
        showToast('This email is already registered! Please login.', true);
        return;
      }

      // 6. Create & Store User
      const newUser = {
        id: 'usr_' + Date.now(),
        username: username,
        email: email,
        password: password,
        role: 'user'
      };

      STATE.registeredUsers.push(newUser);
      try {
        localStorage.setItem('imovies_registered_users', JSON.stringify(STATE.registeredUsers));
        localStorage.setItem('imovies_active_session', JSON.stringify(newUser));
      } catch (err) {}

      STATE.user = newUser;
      showToast(`🎉 Welcome ${username}! Account created successfully.`);
      switchView('home');
    }

      e.preventDefault();
      const adminUser = {
        id: 'adm_' + Date.now(),

      };

    // 100% Working Login Handler
    function handleLoginSubmit(e) {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value.trim().toLowerCase();
      const password = document.getElementById('loginPassword').value;

      const matched = STATE.registeredUsers.find(u => u.email === email && u.password === password);

      if (matched) {

    }

    function selectMovieForShows(movieId) {
      const movie = STATE.movies.find(m => m.id === movieId);
      switchView('shows', { movie });
    }

    function selectShowForSeats(showId) {
      const show = STATE.shows.find(s => s.id === showId);
      STATE.selectedSeats = [];
      switchView('seats', { show });
    }

    function toggleSeat(seatId, price) {
      const idx = STATE.selectedSeats.findIndex(s => s.id === seatId);
      if (idx > -1) {
        STATE.selectedSeats.splice(idx, 1);
      } else {
        STATE.selectedSeats.push({ id: seatId, price });
      }
      renderApp();
    }

    function confirmTicketOrder(totalAmt) {
      if (STATE.selectedSeats.length === 0) return;
      const movie = STATE.selectedMovie || STATE.movies[0];
      const show = STATE.selectedShow || STATE.shows[0];
      const newB = {
        id: "BK-" + Math.floor(1000 + Math.random() * 9000),
        movie: movie.name,
        theatre: show.theatre,
        showdate: show.date,
        showtime: show.time,
        seats: `Selected (${STATE.selectedSeats.length}): ${STATE.selectedSeats.map(s => s.id).join(', ')}`,
        price: `${totalAmt}₹`,
        poster: movie.poster
      };
      STATE.bookings.unshift(newB);
      STATE.selectedSeats = [];
      showToast('🎟️ Booking Confirmed successfully!');
      switchView('bookings');
    }

    function deleteMovie(movieId) {
      STATE.movies = STATE.movies.filter(m => m.id !== movieId);
      showToast('Movie removed from catalog');
      renderApp();
    }

    function deleteShow(showId) {
      STATE.shows = STATE.shows.filter(s => s.id !== showId);
      showToast('Show deleted successfully');
      renderApp();
    }

    function handleAddMovieSubmit(e) {
      e.preventDefault();
      const name = document.getElementById('newMovieName').value;
      const genres = document.getElementById('newMovieGenres').value.split(',').map(s => s.trim());
      const customPoster = document.getElementById('newMoviePoster').value.trim();
      const newMovie = {
        id: Date.now().toString(),
        name,
        date: "Today",
        genres,
        poster: customPoster || "https://image.tmdb.org/t/p/w500/vNVFt6dtcqnI7hqa6LFBUibuFiw.jpg"
      };
      STATE.movies.unshift(newMovie);
      showToast('Movie added to catalog!');
      switchView('home');
    }

    function handleAddShowSubmit(e) {
      e.preventDefault();
      const theatre = document.getElementById('newShowTheatre').value;
      const movie = document.getElementById('newShowMovie').value;
      const date = document.getElementById('newShowDate').value || 'Tomorrow';
      const time = document.getElementById('newShowTime').value || '18:00';
      STATE.shows.unshift({
        id: "s" + Date.now(),
        theatre,
        movie,
        date,
        time
      });
      showToast('Show scheduled successfully!');
      switchView('admin');
    }

    function handleAddTheatreSubmit(e) {
      e.preventDefault();
      showToast('Theatre registered successfully!');
      switchView('admin');
    }

    // Launch App
    renderApp();
  </script>
</body>
</html>
